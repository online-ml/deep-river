[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep_river"
version = "0.3.2"
description = "Online Deep Learning for river"
authors = [
    {name = "Cedric Kulbach", email = "cedric.kulbach@googlemail.com"},
    {name = "Lucas Cazzonelli", email = "Cazzonelli@fzi.de"},
    {name = "Hoang-Anh Ngo", email = "hoang-anh.ngo@alumni.polytechnique.org"},
    {name = "Max Halford", email = "maxhalford25@gmail.com"},
    {name = "Saulo Martiello Mastelini", email = "saulomastelini@gmail.com"},
]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = ["online-learning", "deep-learning", "data-streams"]
dependencies = [
    "numpy>=2.2.5,<3",
    "pandas>=2.2,<3",
    "river>=0.25,<0.26",
    "scikit-learn>=1.5.1,<2",
    "sortedcontainers>=2.4.0",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.5,<2.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tqdm~=4.66.5",
    "torchviz~=0.0.2",
]

[project.urls]
Homepage = "https://github.com/online-ml/deep-river"
Repository = "https://github.com/online-ml/deep-river"
Documentation = "https://github.com/online-ml/deep-river"


[tool.setuptools.packages.find]
include = ["deep_river*"]
exclude = ["site*", "paper*"]

[tool.mypy]
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob='README.md' -q"
testpaths = ["deep_river", "README.md"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "codecov>=2.1.13",
    "dominate>=2.9.1",
    "flake8>=7.3.0",
    "graphviz>=0.20.3",
    "isort>=6.0.1",
    "ipykernel>=6.9.0,<7.0.0",
    "jinja2>=3.0.3",
    "jupyter-contrib-nbextensions>=0.7.0",
    "jupyter-client>=7.0.0",
    "matplotlib>=3.9.2",
    "mkdocstrings-python>=1.18.2",
    "mypy>=1.17.0",
    "nbconvert>=7.0.0",
    "numpydoc>=1.2",
    "plotly>=6.3.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "python-slugify>=8.0.0",
    "pyupgrade>=3.17.0",
    "spacy>=3.2.2",
    "tabulate>=0.9.0",
    "watermark>=2.3.1",
    "zensical>=0.0.31",
]
