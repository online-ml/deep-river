name: unit-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest, macos-latest, windows-latest]
        river: ['0.25.0']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ matrix.river }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python }}-${{ matrix.river }}-
            uv-${{ runner.os }}-${{ matrix.python }}-
            uv-${{ runner.os }}-

      - name: Install dependencies with river ${{ matrix.river }}
        run: |
          uv sync --python ${{ matrix.python }} --all-extras --upgrade-package torch
          uv pip install --python ${{ matrix.python }} "river==${{ matrix.river }}"

      - name: Download datasets
        run: uv run --no-sync --python ${{ matrix.python }} python -c "from river import datasets; datasets.Bikes().download(); datasets.CreditCard().download(); datasets.Elec2().download(); datasets.Keystroke().download()"

      - name: Run tests (generate coverage.xml)
        run: |
          uv run --no-sync --python ${{ matrix.python }} pytest -v --cov=deep_river --cov-report=term-missing --cov-report=xml:coverage.xml -m "not datasets"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.river == '0.25.0'
        run: uv build

      - name: Upload coverage artifact (diagnostic)
        uses: actions/upload-artifact@v7
        if: always()
        with:
            name: coverage-${{ matrix.os }}-py${{ matrix.python }}-river${{ matrix.river }}
            path: coverage.xml
            if-no-files-found: warn

      - name: Upload coverage report to Codecov (aggregate project)
        if: github.repository == 'online-ml/deep-river' && matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.river == '0.25.0'
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          name: ${{ matrix.os }}-py${{ matrix.python }}-river${{ matrix.river }}
          fail_ci_if_error: true
          verbose: true
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  minimum-direct-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install minimum direct dependencies
        run: |
          uv sync --python 3.12 --all-extras --no-dev --resolution lowest-direct --upgrade
          uv pip install --python 3.12 pytest pytest-cov

      - name: Print dependency versions
        run: uv run --no-sync --python 3.12 python -c "import importlib.metadata as m, platform; print(f'python=={platform.python_version()}'); [print(f'{name}=={m.version(name)}') for name in ('numpy', 'pandas', 'river', 'scikit-learn', 'scipy', 'sortedcontainers', 'torch', 'torchviz', 'tqdm')]"

      - name: Download datasets
        run: uv run --no-sync --python 3.12 python -c "from river import datasets; datasets.Bikes().download(); datasets.CreditCard().download(); datasets.Elec2().download(); datasets.Keystroke().download()"

      - name: Run tests (generate coverage.xml)
        run: |
          uv run --no-sync --python 3.12 pytest -v --cov=deep_river --cov-report=term-missing --cov-report=xml:coverage.xml -m "not datasets"
        env:
          PYTHONPATH: ${{ github.workspace }}
